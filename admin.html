<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北海道網站管理後台</title><style>
:root{--ink:#16342f;--green:#2f6f61;--paper:#f7f5ef;--line:#d8ddd8;--red:#b34d45}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{background:var(--ink);color:white;padding:1rem 5vw;display:flex;justify-content:space-between;align-items:center;gap:1rem}.top h1{font-size:1.15rem;margin:0}.top a{color:#d8eee8}.wrap{max-width:1080px;margin:auto;padding:2rem 1.2rem}.login,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.5rem;box-shadow:0 12px 35px rgba(20,50,45,.09)}button,.btn{border:0;border-radius:10px;padding:.75rem 1rem;background:var(--green);color:white;font-weight:700;cursor:pointer}button.secondary{background:#708079}button.danger{background:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}.status{color:#66746f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:1.1rem}.item h3{margin:.2rem 0}.meta{font-size:.84rem;color:#718079}.actions{display:flex;gap:.5rem;margin-top:.8rem}.actions button{padding:.48rem .7rem;font-size:.85rem}dialog{width:min(620px,calc(100% - 2rem));border:0;border-radius:18px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,35,32,.58)}form{padding:1.5rem}form h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.field{display:grid;gap:.35rem}.field.full{grid-column:1/-1}label{font-size:.86rem;font-weight:700}input,select,textarea{width:100%;border:1px solid #bbc5c1;border-radius:9px;padding:.72rem;background:white;font:inherit}textarea{min-height:120px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}.hidden{display:none!important}.notice{padding:.8rem 1rem;background:#e7f2ee;border-radius:10px;margin-bottom:1rem}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><h1>北海道四季網站｜管理後台</h1><a href="./" target="_blank">查看公開網站 ↗</a></header><main class="wrap">
<section id="login" class="login"><h2>管理者登入</h2><p>請使用已授權的 Google 帳號登入。只有指定管理者能修改網站內容。</p><button id="loginBtn">使用 Google 登入</button><p id="loginMsg" class="status"></p></section>
<section id="app" class="hidden"><div class="toolbar"><div><h2>景點內容</h2><div id="userInfo" class="status"></div></div><div><button id="addBtn">＋ 新增景點</button> <button id="logoutBtn" class="secondary">登出</button></div></div><div id="notice" class="notice hidden"></div><div id="list" class="grid"></div></section>
</main>
<dialog id="editor"><form id="form"><h2 id="formTitle">新增景點</h2><input type="hidden" id="docId"><div class="fields">
<div class="field"><label for="name">景點名稱</label><input id="name" required maxlength="80"></div><div class="field"><label for="location">地點</label><input id="location" required maxlength="80"></div>
<div class="field"><label for="season">季節</label><select id="season" required><option value="spring">春季</option><option value="summer">夏季</option><option value="autumn">秋季</option><option value="winter">冬季</option></select></div><div class="field"><label for="order">排序</label><input id="order" type="number" min="1" value="1" required></div>
<div class="field full"><label for="description">景點介紹</label><textarea id="description" required maxlength="500"></textarea></div><div class="field full"><label><input id="published" type="checkbox" checked style="width:auto"> 在公開網站顯示</label></div>
</div><div class="form-actions"><button type="button" id="cancelBtn" class="secondary">取消</button><button type="submit" id="saveBtn">儲存</button></div></form></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA2tJsoKnX5RYEtF9es19XaZyZ-JgF2i0A",authDomain:"hokkaido--japan.firebaseapp.com",projectId:"hokkaido--japan",storageBucket:"hokkaido--japan.firebasestorage.app",messagingSenderId:"540830636468",appId:"1:540830636468:web:4ea022f410aac61a13fae1"};
const ADMIN="sandrachu75@gmail.com",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));let rows=[];
const labels={spring:"春季",summer:"夏季",autumn:"秋季",winter:"冬季"};
async function load(){const snap=await getDocs(collection(db,"attractions"));rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.season.localeCompare(b.season)||(a.order??99)-(b.order??99));$("#list").innerHTML=rows.map(x=>`<article class="item"><div class="meta">${labels[x.season]||x.season} · 排序 ${x.order??"-"} · ${x.published===false?"已隱藏":"已發布"}</div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.location)}</div><p>${esc(x.description)}</p><div class="actions"><button data-edit="${x.id}">編輯</button><button class="danger" data-delete="${x.id}">刪除</button></div></article>`).join("")||"尚無景點資料";}
function openEditor(x={}){$("#form").reset();$("#docId").value=x.id||"";$("#name").value=x.name||"";$("#location").value=x.location||"";$("#season").value=x.season||"spring";$("#order").value=x.order||1;$("#description").value=x.description||"";$("#published").checked=x.published!==false;$("#formTitle").textContent=x.id?"編輯景點":"新增景點";$("#editor").showModal();}
getRedirectResult(auth).catch(e=>$("#loginMsg").textContent=e.message);$("#loginBtn").onclick=()=>signInWithRedirect(auth,new GoogleAuthProvider());$("#logoutBtn").onclick=()=>signOut(auth);$("#addBtn").onclick=()=>openEditor();$("#cancelBtn").onclick=()=>$("#editor").close();
$("#list").onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit)openEditor(rows.find(x=>x.id===edit));if(del&&confirm("確定刪除這個景點？此動作無法復原。")){await deleteDoc(doc(db,"attractions",del));await load();}};
$("#form").onsubmit=async e=>{e.preventDefault();const id=$("#docId").value||crypto.randomUUID();$("#saveBtn").disabled=true;try{await setDoc(doc(db,"attractions",id),{name:$("#name").value.trim(),location:$("#location").value.trim(),season:$("#season").value,order:Number($("#order").value),description:$("#description").value.trim(),published:$("#published").checked});$("#editor").close();await load();}finally{$("#saveBtn").disabled=false}};
onAuthStateChanged(auth,async user=>{const ok=user?.email===ADMIN;$("#login").classList.toggle("hidden",ok);$("#app").classList.toggle("hidden",!ok);if(ok){$("#userInfo").textContent=`已登入：${user.email}`;await load();}else if(user)await signOut(auth);});
</script></body></html>
